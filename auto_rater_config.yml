  - name: "qwen3.6-27b"
    triage_model: "localai/qwen3.6-27b"
    summary_model: "localai/qwen3.6-27b"
    reasoning_effort: "none"
  - name: "qwen3.6-35b-a3b"
    triage_model: "localai/qwen3.6-35b-a3b"
    summary_model: "localai/qwen3.6-35b-a3b"
    # Belt-and-braces alongside triage.py's invisible-character stripping, which removed the
    # trigger this model actually choked on. On 5 of 100 emails its reasoning failed to converge
    # and returned empty completions (a 502) on all 4 retry attempts -- deterministic, so the
    # retry could not help. Raising max_tokens is not the answer: the 89 healthy calls needed a
    # median of 1,236 completion tokens against a 3,072 cap, while one stalled email wanted 4,647
    # and another never finished at all given 16,384. Reasoning off fixes 5/5 at ~100 tokens.
    reasoning_effort: "none"
  - name: "qwythos-9b-claude-mythos"
    triage_model: "localai/qwythos-9b-claude-mythos"
    summary_model: "localai/qwythos-9b-claude-mythos"
    # Required for this model, not a tuning choice -- same pathology as qwen3.5-0.8b below, but
    # intermittent rather than every call: on a few percent of requests it never converges, burns
    # the entire completion budget on reasoning tokens, and emits no content, which the proxy
    # reports as a 502 upstream_empty_response. Measured over all 100 offline emails at Level 1:
    # 3/100 stalled this way with reasoning on, 0/100 with it off. Raising max_tokens is the wrong
    # lever -- the stall runs until the budget is gone, so a 5x bigger cap just turns an 18s
    # failure into a 90s one. Disabling reasoning also cuts median Level 1 spend from ~600 to
    # ~90 completion tokens.
    reasoning_effort: "none"
    tei_router_enabled: false
  - name: "qwen3.5-0.8b"
    triage_model: "localai/qwen_qwen3.5-0.8b"
    summary_model: "localai/qwen_qwen3.5-0.8b"
    tei_router_enabled: false
    # Required for this model, not a tuning choice: left to think, it collapses into a
    # repetition loop and spends the entire completion budget on reasoning tokens without
    # ever emitting content, which the proxy reports as a 502 empty upstream response.
    reasoning_effort: "none"
  - name: "gpt-5.6-sol"
    triage_model: "cx/gpt-5.6-sol"
    summary_model: "cx/gpt-5.6-sol"
  - name: "gpt-5.6-luna-low"
    triage_model: "cx/gpt-5.6-luna-low"
    summary_model: "cx/gpt-5.6-luna-low"
