    summary_model: "gemini-3.1-pro"
  - name: "gemini_flash_lite"
    triage_model: "gemini-3.1-flash-lite"
    summary_model: "gemini-3.1-flash-lite"
  - name: "gemini_flash"
    triage_model: "gemini-3.6-flash"
    summary_model: "gemini-3.6-flash"
