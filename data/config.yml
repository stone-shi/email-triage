llm:
  base_url: "https://your-llm-proxy.com/v1"
  triage_model: "deepseek-v4-flash"
  summary_model: "deepseek-v4-pro"

triage:
  confidence_threshold: 0.8
  triage_type: "llm"
  tei_url: "https://omniroute.local.shifamily.com/v1/rerank"
  tei_model: "localai/qwen3-reranker-0.6b"
  tei_router_enabled: false
  tei_noise_enabled: true
  tei_noise_threshold: 0.99
  whitelist_vip_senders: []
  whitelist_domains:
    - "@none"
  blacklist_keywords:
    - "unsubscribe"
    - "newsletter"
    - "promotions"
    - "marketing"
    - "digest"
    - "advertisement"
    - "^(Album|Movie|Episode) (Grabbed|Downloaded|Added|Deleted)$"
    - "^(Ordered|Shipped|Delivered): .*"
    - ".* updates$"
    - "^New in .*: .*"
    - "^You're Invited: .*"
  blacklist_senders:
    - "spammer@domain.com"
    - "offers@"
    - "newsletters@"

logging:
  level: "INFO"

# Background sync scheduler (MCP server, SSE/daemon transport only)
scheduler:
  enabled: true
  interval: "15m"
  max_per_account: 50
  days: 7

# Recurring trigger for the full-mailbox archive downloader ("Download All" on the dashboard).
# Sleeps for the full interval before its first run (not immediately on startup, unlike the sync
# scheduler above), so a container restart doesn't kick off a full mailbox listing every time.
# After the first (expensive) backfill, subsequent runs are cheap since already-archived messages
# are skipped -- a nightly cadence just picks up whatever's new since the last run.
download_all_scheduler:
  enabled: true
  interval: "24h"

# Automatically mark already-triaged unread emails as read -- both on the mail server and in
# the local cache -- once they've been shown via fetch_and_process_unread at least
# `after_displays` times. Applied by the background sync scheduler on each tick. Each triage
# level is configured independently: e.g. auto-mark level 0 (noise) after a single view while
# leaving level 2 (important) off entirely.
auto_mark_read:
  level_0:
    enabled: false
    after_displays: 1
  level_1:
    enabled: false
    after_displays: 1
  level_2:
    enabled: false
    after_displays: 1
