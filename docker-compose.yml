version: '3.8'

services:
  email-triage-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.shifamily.com/homestack/email-triage:latest
    container_name: email-triage-mcp
    env_file:
      - .env
    environment:
      - EMAIL_TRIAGE_MCP_TRANSPORT=sse
    ports:
      - "4003:8000"
    volumes:
      - ./profiles:/app/profiles
      - ./data:/app/data
    restart: unless-stopped
    command: ["python", "mcp_server.py"]
    networks:
      - home-net

networks:
  home-net:
    external: true
